services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerx
      POSTGRES_USER: ${DATABASE_USER:-careerx}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-careerx} -d careerx']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/careerx
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -Duser.timezone=UTC
    depends_on:
      db:
        condition: service_healthy
    expose: ['8080']
    restart: unless-stopped
    mem_limit: 1g
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:8080'
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
